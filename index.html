<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambola Ticket Generator</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --accent: #b5537a;
    --accent-dark: #8a3a5c;
    --ink: #2b2b2b;
    --border: #2b2b2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    color: var(--accent-dark);
    text-align: center;
  }
  .subtitle {
    margin: 0 0 24px;
    color: #666;
    font-size: 0.95rem;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
  }
  input[type="text"] {
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    min-width: 240px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary {
    background: #fff;
    color: var(--accent-dark);
    border: 2px solid var(--accent);
  }
  button.secondary:hover { background: #f8e9ee; }

  #ticket-wrapper {
    background: var(--card-bg);
    border: 3px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px 24px;
    width: 100%;
    max-width: 620px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }
  .ticket-header {
    text-align: center;
    margin-bottom: 14px;
  }
  .ticket-header .host {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent-dark);
    letter-spacing: 0.5px;
  }
  .ticket-header .code {
    margin-top: 4px;
    font-size: 0.85rem;
    color: #555;
    font-family: 'Consolas', monospace;
  }
  table.tambola {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  table.tambola td {
    border: 2px solid var(--border);
    text-align: center;
    height: 48px;
    font-size: 1.15rem;
    font-weight: 600;
    background: #fffdf8;
  }
  table.tambola td.filled { background: #fdf1f4; color: var(--accent-dark); }
  table.tambola td.empty { background: #f0ede6; }

  .footer-note {
    margin-top: 14px;
    text-align: center;
    font-size: 0.75rem;
    color: #888;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    #ticket-wrapper { box-shadow: none; border: 2px solid #000; }
  }
</style>
</head>
<body>

  <h1>Tambola Ticket Generator</h1>
  <p class="subtitle">Generate a valid single Tambola / Housie ticket</p>

  <div class="controls">
    <input type="text" id="hostName" value="Beautiful Women's Group" placeholder="Host name">
    <button id="generateBtn">Generate Ticket</button>
    <button id="printBtn" class="secondary">Print</button>
  </div>

  <div id="ticket-wrapper">
    <div class="ticket-header">
      <div class="host" id="hostDisplay"></div>
      <div class="code" id="codeDisplay"></div>
    </div>
    <table class="tambola" id="ticketTable"></table>
    <div class="footer-note">Each ticket has 15 numbers across 3 rows &amp; 9 columns. Keep the verification code for authenticity checks.</div>
  </div>

<script>
  // Column ranges: col0 -> 1-9, col1 -> 10-19, ..., col8 -> 80-90
  const COLUMN_RANGES = [[1, 9]];
  for (let i = 1; i <= 7; i++) COLUMN_RANGES.push([i * 10, i * 10 + 9]);
  COLUMN_RANGES.push([80, 90]);

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function sampleWithoutReplacement(arr, count) {
    const pool = arr.slice();
    const result = [];
    for (let i = 0; i < count; i++) {
      const idx = randomInt(0, pool.length - 1);
      result.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return result;
  }

  function generateColumnCounts() {
    while (true) {
      const counts = Array.from({ length: 9 }, () => randomInt(1, 3));
      const sum = counts.reduce((a, b) => a + b, 0);
      if (sum === 15) return counts;
    }
  }

  function assignRows(counts) {
    while (true) {
      const rowHasCol = [[], [], []];
      const colRows = [];
      for (let col = 0; col < counts.length; col++) {
        const rows = sampleWithoutReplacement([0, 1, 2], counts[col]);
        colRows.push(rows);
        rows.forEach(r => rowHasCol[r].push(col));
      }
      if (rowHasCol.every(cols => cols.length === 5)) return colRows;
    }
  }

  function generateTicket() {
    const counts = generateColumnCounts();
    const colRows = assignRows(counts);
    const grid = Array.from({ length: 3 }, () => Array(9).fill(""));

    colRows.forEach((rows, colIndex) => {
      const [low, high] = COLUMN_RANGES[colIndex];
      const fullRange = [];
      for (let n = low; n <= high; n++) fullRange.push(n);
      const numbers = sampleWithoutReplacement(fullRange, rows.length).sort((a, b) => a - b);
      const sortedRows = rows.slice().sort((a, b) => a - b);
      sortedRows.forEach((r, i) => { grid[r][colIndex] = numbers[i]; });
    });

    return grid;
  }

  function generateVerificationCode() {
    const now = new Date();
    const datePart = now.getFullYear().toString()
      + String(now.getMonth() + 1).padStart(2, "0")
      + String(now.getDate()).padStart(2, "0");
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let randomPart = "";
    for (let i = 0; i < 6; i++) randomPart += chars[randomInt(0, chars.length - 1)];
    return `${datePart}-${randomPart}`;
  }

  function renderTicket() {
    const hostName = document.getElementById("hostName").value.trim() || "Tambola Host";
    const grid = generateTicket();
    const code = generateVerificationCode();

    document.getElementById("hostDisplay").textContent = hostName;
    document.getElementById("codeDisplay").textContent = `Verification Code: ${code}`;

    const table = document.getElementById("ticketTable");
    table.innerHTML = "";
    grid.forEach(row => {
      const tr = document.createElement("tr");
      row.forEach(cell => {
        const td = document.createElement("td");
        if (cell === "") {
          td.className = "empty";
        } else {
          td.className = "filled";
          td.textContent = cell;
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  }

  document.getElementById("generateBtn").addEventListener("click", renderTicket);
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  renderTicket();
</script>

</body>
</html>
